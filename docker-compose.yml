services:
  postgres:
    image: postgres:latest
    container_name: modsen-catalog
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    depends_on:
      - postgres
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
    ports:
      - "8081:8081"

volumes:
  postgres_data:
